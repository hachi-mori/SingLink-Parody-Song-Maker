name: Deploy audited SingLink to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Test Web
        working-directory: web
        run: npm test
      - name: Build and audit public assets
        working-directory: web
        run: npm run build
      - name: Assemble identical audited apps at both public paths
        run: |
          mkdir -p pages-site/openai-build-week
          cp -a web/dist/client/. pages-site/
          cp -a web/dist/client/. pages-site/openai-build-week/
          printf '%s\n' "$(git rev-parse HEAD)" > pages-site/version.txt
          cp pages-site/version.txt pages-site/openai-build-week/version.txt
          test -f pages-site/index.html
          test -f pages-site/openai-build-week/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: pages-site
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4